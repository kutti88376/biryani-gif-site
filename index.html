
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spicy Corner</title>
  <style>
    body {
      background-color: pink;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    h1 {
      color: red;
      font-family: Algerian, sans-serif;
      font-size: 70px;
      text-align: left;
      margin: 20px;
      transition: all 0.3s ease;
    }

    h1:hover {
      background-color: lightblue;
      color: darkblue;
    }

    h2 {
      color: blue;
      text-align: center;
      font-family: Algerian, sans-serif;
      font-size: 60px;
      margin: 0;
    }

    .video-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    iframe {
      width: 80%;
      height: 400px;
      border: none;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <h1>ওয়েলকাম টু স্পাইসি সেন্টার</h1>

  <h2><marquee>৩১ শে মার্চ পর্যন্ত ২৫% ডিসকাউন্ট</marquee></h2>

  <div class="video-container">
    <iframe 
      src="https://drive.google.com/file/d/19v6cA88P6XOLKfhH0FYnSY8jI_jcjfer/preview?autoplay=1&mute=1"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
